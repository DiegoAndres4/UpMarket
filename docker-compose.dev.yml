# Entorno de DESARROLLO de UPMarket completo: web + AuthCore + dominio + MySQL. No necesita .env.
# Uso: docker compose -f docker-compose.dev.yml up --build --watch
# Las claves de este archivo son solo para uso local: nunca las uses en producción.
# AuthCore se toma de la carpeta local. Si está en otra ruta, define AUTHCORE_DEV_PATH.
name: upmarket-dev   # nombre propio: sus volúmenes no se mezclan con los del despliegue

services:
  db:
    image: mysql:8.4
    command: ["--performance-schema=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: root-dev
      MYSQL_USER: upmarket
      MYSQL_PASSWORD: upmarket-dev
    ports:
      - "127.0.0.1:3307:3306"   # 3307 para no chocar con un MySQL instalado en el equipo
    volumes:
      - db-data:/var/lib/mysql
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  authcore:
    build:
      context: ${AUTHCORE_DEV_PATH:-../Auth-Core-UpMarket}
      dockerfile: Dockerfile.dev
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/authcoredb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: upmarket
      SPRING_DATASOURCE_PASSWORD: upmarket-dev
      JWT_SECRET: dev-solo-local-no-usar-en-produccion-upmarket-clave-jwt-20261109
      AUTHCORE_ADMIN_PASSWORD: admin-dev-123
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:5005:5005"   # depurador remoto de AuthCore
    volumes:
      - gradle-cache:/home/gradle/.gradle   # las dependencias se descargan una sola vez
    develop:
      watch:
        - action: sync+restart
          path: ${AUTHCORE_DEV_PATH:-../Auth-Core-UpMarket}/src/main
          target: /app/src/main
        - action: rebuild
          path: ${AUTHCORE_DEV_PATH:-../Auth-Core-UpMarket}/build.gradle

  domain:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod,demo   # "prod" usa MySQL; "demo" habilita el seed
      DB_URL: jdbc:mysql://db:3306/upmarket?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: upmarket
      DB_PASSWORD: upmarket-dev
      # Los mismos bytes que JWT_SECRET, en Base64. Si no coinciden, el dominio rechaza todos los tokens.
      JWT_SECRET_BASE64: ZGV2LXNvbG8tbG9jYWwtbm8tdXNhci1lbi1wcm9kdWNjaW9uLXVwbWFya2V0LWNsYXZlLWp3dC0yMDI2MTEwOQ==
      FOTOS_DIR: /data/fotos
      UPMARKET_SEED_ENABLED: "true"
      AUTHCORE_URL: http://authcore:8081
    ports:
      - "127.0.0.1:8084:8084"
      - "127.0.0.1:5006:5005"   # depurador remoto del dominio
    volumes:
      - maven-cache:/root/.m2   # las dependencias se descargan una sola vez
      - fotos-data:/data/fotos
    develop:
      watch:
        - action: sync+restart
          path: ./src/main
          target: /app/src/main
        - action: rebuild
          path: ./pom.xml

  # Misma puerta única que en producción. El frontend se monta desde el disco: basta guardar y recargar.
  # Da 502 hasta que AuthCore y el dominio terminen de compilar.
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/css:/usr/share/nginx/html/css:ro
      - ./frontend/js:/usr/share/nginx/html/js:ro
      - ./frontend/public:/usr/share/nginx/html/public:ro

volumes:
  db-data:
  fotos-data:
  gradle-cache:
  maven-cache:
