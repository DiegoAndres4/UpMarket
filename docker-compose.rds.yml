# Capa de compose para usar un MySQL administrado (RDS) en lugar del contenedor `db`.
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.rds.yml up -d --build
# Requiere Docker Compose >= 2.24 (etiqueta `!reset`).
services:
  # El MySQL local queda desactivado: el perfil no se activa salvo con --profile local-db.
  db:
    profiles: ["local-db"]

  authcore:
    # Sin dependencia del contenedor db: RDS ya existe fuera de Docker.
    depends_on: !reset {}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:3306/authcoredb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

  domain:
    depends_on: !reset {}
    environment:
      DB_URL: jdbc:mysql://${DB_HOST}:3306/upmarket?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
