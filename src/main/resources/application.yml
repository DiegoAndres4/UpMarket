server:
  port: 8084

spring:
  application:
    name: domain-service-upmarket
  datasource:
    url: jdbc:h2:mem:upmarket;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false          # los adaptadores abren su propia transacción; nada de lazy loading en la capa REST
    hibernate:
      ddl-auto: update
  flyway:
    # Solo en producción (application-prod.yml): en dev/H2 el esquema lo crea Hibernate.
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

seguridad:
  jwt:
    # Clave COMPARTIDA con AuthCore, en Base64. NO se escribe aquí: se entrega por variable de entorno.
    # Sin esta variable la aplicación no arranca (falla rápido, a propósito).
    secret-base64: ${JWT_SECRET_BASE64}

negocio:
  zona-horaria: America/Bogota

authcore:
  # Base de AuthCore para borrar credenciales cuando el usuario elimina su cuenta.
  url: ${AUTHCORE_URL:http://localhost:8081}

fotos:
  # Dónde se guardan las imágenes subidas. En Docker/AWS: volumen montado en /data/fotos (FOTOS_DIR).
  directorio: ${FOTOS_DIR:./fotos}

cloudinary:
  # Credenciales SOLO por variables de entorno; nunca se escriben aquí. Si proveedor=cloudinary y
  # faltan (ni CLOUDINARY_URL ni las tres anteriores), la aplicación falla rápido al arrancar.
  url: ${CLOUDINARY_URL:}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

cors:
  # Solo para desarrollo con el frontend en otro puerto (ej. http://localhost:5500). Vacío = sin CORS.
  origenes: ${CORS_ORIGENES:}

upmarket:
  fotos:
    # Proveedor de almacenamiento de fotos: local (por defecto; dev/tests/CI sin credenciales) o cloudinary.
    proveedor: ${FOTOS_PROVEEDOR:local}
  publicacion:
    # Tarifa en COP para publicar. El cobro real es simulado; una pasarela real se enchufa detrás de PasarelaPagoPort.
    tarifa: ${UPMARKET_TARIFA_PUBLICACION:3000}
  seed:
    enabled: ${UPMARKET_SEED_ENABLED:false}
