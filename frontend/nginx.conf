# Límites de peticiones por IP: frenan fuerza bruta sobre el login y creación masiva de cuentas.
# (Deben declararse en contexto http; los archivos de conf.d ya se incluyen dentro de http.)
limit_req_zone $binary_remote_addr zone=login:10m    rate=20r/m;   # 20 intentos/min por IP (la red del campus comparte IP)
limit_req_zone $binary_remote_addr zone=register:10m rate=10r/m;   # 10 registros/min por IP
limit_req_zone $binary_remote_addr zone=subidas:10m  rate=20r/m;   # subidas de fotos
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;                # no revela la versión de nginx

    client_max_body_size 6m;          # fotos de hasta 5 MB (+ cabeceras del formulario)

    # Si hay un proxy TLS delante (Caddy/ALB), la IP real viene en X-Forwarded-For.
    # Solo se confía en redes privadas, para que nadie pueda falsificar su IP desde internet.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Resolución dinámica: el proxy arranca aunque un servicio tarde en estar listo.
    resolver 127.0.0.11 valid=10s;
    set $authcore http://authcore:8081;
    set $domain   http://domain:8084;

    # Registro e ingreso: AuthCore (sin modificarlo). Solo se exponen estas dos rutas.
    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass $authcore;
    }
    location = /api/auth/register {
        limit_req zone=register burst=10 nodelay;
        proxy_pass $authcore;
    }
    # Administración de usuarios de AuthCore: no se publica por internet.
    location /api/auth/ { return 404; }

    # Subida de fotos: limitada para que nadie llene el disco.
    location = /api/fotos {
        limit_req zone=subidas burst=10 nodelay;
        proxy_pass $domain;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Servicio de dominio.
    location /api/ {
        proxy_pass $domain;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
