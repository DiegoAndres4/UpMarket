server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;          # fotos de hasta 5 MB (+ cabeceras del formulario)

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Resolución dinámica: el proxy arranca aunque un servicio tarde en estar listo.
    resolver 127.0.0.11 valid=10s;
    set $authcore http://authcore:8081;
    set $domain   http://domain:8084;

    # Registro e ingreso: AuthCore (sin modificarlo). Solo se exponen estas dos rutas.
    location = /api/auth/login    { proxy_pass $authcore; }
    location = /api/auth/register { proxy_pass $authcore; }
    # Administración de usuarios de AuthCore: no se publica por internet.
    location /api/auth/ { return 404; }

    # Servicio de dominio.
    location /api/ {
        proxy_pass $domain;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
