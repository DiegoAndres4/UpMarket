<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>UPMarket · Mercado de estudiantes</title>
  <link rel="preload" href="css/fuentes/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="js/tema.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="salto" href="#app">Saltar al contenido</a>
  <header class="barra">
    <a class="marca" href="#/">UP<span>Market</span></a>
    <div class="barra__fin">
      <nav id="nav" aria-label="Principal"></nav>
      <div class="barra__acciones">
        <button id="tema" class="boton-tema" type="button" aria-label="Cambiar a modo oscuro" aria-pressed="false">
          <svg class="icono-luna" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
          <svg class="icono-sol" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
        </button>
        <button id="menu" class="menu" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </header>
  <main id="app" class="contenedor" tabindex="-1"></main>
  <div id="aviso" class="aviso" role="status" aria-atomic="true" hidden></div>
  <footer id="pie" class="pie"><img src="public/escudo-128.png" alt="Escudo de la Universidad de Pamplona" width="128" height="167" loading="lazy" decoding="async"><span>Proyecto Integrador · Universidad de Pamplona</span></footer>
  <script src="js/app.js"></script>
</body>
</html>
