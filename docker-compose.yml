# UPMarket completo: web (nginx + frontend) -> authcore + domain -> MySQL.
# Uso:  ./deploy/generar-env.sh  &&  docker compose up -d --build
# Con HTTPS: docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build  (ver DEPLOY_AWS.md)
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # Menos memoria: buffer de InnoDB de 256 MB y sin performance_schema (ahorra ~300 MB).
    command: ["--innodb-buffer-pool-size=256M", "--performance-schema=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?falta DB_ROOT_PASSWORD en .env}
      MYSQL_USER: upmarket
      MYSQL_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
    volumes:
      - mysql-data:/var/lib/mysql
      # Solo se ejecuta al crear el volumen por primera vez. En una base ya creada: ./deploy/crear-bases.sh
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Tope de memoria por contenedor. Total: 1200 + 640 + 640 + 128 (+64 de Caddy) ≈ 2.7 GB en un t3.medium de 4 GB.
    mem_limit: 1200m

  # AuthCore se construye desde su propio repositorio. Su Dockerfile (rama main)
  # ya usa Gradle 8.14 y corre como usuario sin privilegios.
  # Si lo tienes clonado al lado, pon en .env: AUTHCORE_CONTEXT=../Auth-Core-UpMarket
  authcore:
    build:
      context: ${AUTHCORE_CONTEXT:-https://github.com/DiegoAndres4/auth-core-upmarket.git#main}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/authcoredb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: upmarket
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      # Se fija aquí para que el comportamiento no dependa del application.yml de AuthCore.
      SPRING_JPA_SHOW_SQL: "false"
      # Obligatoria: AuthCore ya no genera claves aleatorias.
      AUTHCORE_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?falta ADMIN_PASSWORD en .env}
      # Flyway aplica db/migration y Hibernate solo valida el esquema.
      FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-validate}
      # Duración del token. AuthCore no tiene refresh ni revocación: menos tiempo = menos exposición, más reingresos.
      AUTHCORE_JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC
    healthcheck:
      # Sano = /actuator/health responde 200 (incluye la comprobación de la base).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 640m

  domain:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/upmarket?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: upmarket
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?falta JWT_SECRET_BASE64 en .env}
      FOTOS_DIR: /data/fotos
      # Para borrar las credenciales en AuthCore cuando un usuario elimina su cuenta.
      AUTHCORE_URL: http://authcore:8081
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - fotos-data:/data/fotos
    mem_limit: 640m

  web:
    build: ./frontend
    restart: unless-stopped
    # La web solo arranca cuando los dos servicios ya responden.
    depends_on:
      authcore:
        condition: service_healthy
      domain:
        condition: service_healthy
    ports:
      - "80:80"
    mem_limit: 128m

volumes:
  mysql-data:
  fotos-data:
