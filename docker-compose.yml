# UPMarket completo: web (nginx + frontend) -> authcore + domain -> MySQL.
# Uso:  ./deploy/generar-env.sh  &&  docker compose up -d --build
# Con HTTPS: docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build  (ver DEPLOY_AWS.md)
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # Menos memoria: buffer de InnoDB de 256 MB y sin performance_schema (ahorra ~300 MB).
    command: ["--innodb-buffer-pool-size=256M", "--performance-schema=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?falta DB_ROOT_PASSWORD en .env}
      MYSQL_USER: upmarket
      MYSQL_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
    volumes:
      - mysql-data:/var/lib/mysql
      # Solo se ejecuta al crear el volumen por primera vez. En una base ya creada: ./deploy/crear-bases.sh
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Tope de memoria por contenedor. Total: 1200 + 640 + 640 + 128 (+64 de Caddy) ≈ 2.7 GB en un t3.medium de 4 GB.
    mem_limit: 1200m

  # AuthCore se construye desde su propio repositorio, SIN modificarlo.
  # Si lo tienes clonado al lado, pon en .env: AUTHCORE_CONTEXT=../auth-core-upmarket
  authcore:
    build:
      context: ${AUTHCORE_CONTEXT:-https://github.com/DiegoAndres4/auth-core-upmarket.git#master}
      # Ojo: el repositorio de AuthCore solo publica la rama "master" (no "main").
      # Si se apunta a #main el checkout del contexto Git falla y el build se detiene.
      # El Dockerfile de AuthCore usa Gradle 8.10, pero su plugin Spring Boot 4.1.1 exige Gradle 8.14+.
      # Para no modificar AuthCore, aquí se define el build con una imagen de Gradle compatible
      # y, de paso, se ejecuta como usuario sin privilegios (el original corre como root).
      dockerfile_inline: |
        FROM gradle:8.14-jdk21 AS build
        WORKDIR /app
        COPY build.gradle settings.gradle ./
        COPY src ./src
        RUN gradle clean bootJar -x test --no-daemon
        FROM eclipse-temurin:21-jre
        WORKDIR /app
        RUN useradd --system --no-create-home app
        COPY --from=build /app/build/libs/*.jar app.jar
        USER app
        EXPOSE 8081
        ENTRYPOINT ["java", "-jar", "app.jar"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/authcoredb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: upmarket
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      # AuthCore trae show-sql activado en su application.yml y no tiene perfil prod: se apaga desde aquí.
      SPRING_JPA_SHOW_SQL: "false"
      # Con el AuthCore actualizado: si ADMIN_PASSWORD está vacío se genera una clave aleatoria y se muestra una vez en `docker compose logs authcore`.
      AUTHCORE_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # update crea/ajusta tablas solo. Tras el primer despliegue conviene DDL_AUTO=validate en .env (ver DEPLOY_AWS.md).
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
      # Duración del token. AuthCore no tiene refresh ni revocación: menos tiempo = menos exposición, más reingresos.
      AUTHCORE_JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC
    healthcheck:
      # Sano = Tomcat ya acepta conexiones en 8081.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 640m

  domain:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/upmarket?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: upmarket
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?falta JWT_SECRET_BASE64 en .env}
      FOTOS_DIR: /data/fotos
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8084'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - fotos-data:/data/fotos
    mem_limit: 640m

  web:
    build: ./frontend
    restart: unless-stopped
    # La web solo arranca cuando los dos servicios ya responden.
    depends_on:
      authcore:
        condition: service_healthy
      domain:
        condition: service_healthy
    ports:
      - "80:80"
    mem_limit: 128m

volumes:
  mysql-data:
  fotos-data:
